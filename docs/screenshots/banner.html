<!doctype html>
<meta charset="utf-8">
<title>Dodobox banner</title>
<style>
  @font-face { font-family: "Shoulders"; font-weight: 900; src: url("../../public/fonts/big-shoulders-display-latin-900-normal.woff2") format("woff2"); }
  @font-face { font-family: "Figtree"; font-weight: 300 900; src: url("../../public/fonts/figtree-latin-wght-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1800px; height: 860px; overflow: hidden; background: #0c0c11; font-family: Figtree, system-ui, sans-serif; color: #f6f4ef; }
  .stage { position: relative; width: 1800px; height: 860px;
    background:
      radial-gradient(1000px 700px at 1180px 420px, rgba(242, 166, 90, 0.20), transparent 70%),
      radial-gradient(1100px 800px at 0% 100%, rgba(242, 166, 90, 0.07), transparent 60%),
      #0c0c11; }

  h1 { position: absolute; left: 96px; top: 250px; font-family: Shoulders, "Arial Narrow", Impact, sans-serif; font-weight: 900; font-size: 124px; line-height: 0.9; letter-spacing: -0.004em; text-transform: uppercase; }
  h1 em { font-style: normal; color: #f2a65a; }
  .sub { position: absolute; left: 100px; top: 520px; width: 500px; font-size: 27px; line-height: 1.4; font-weight: 500; color: #c0bec8; }
  .tag { position: absolute; left: 100px; top: 670px; display: flex; gap: 10px; font-size: 18px; font-weight: 650; color: #8d8c99; }
  .tag span { padding: 8px 14px; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; }

  .card { position: absolute; overflow: hidden; border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 40px 90px -10px rgba(0,0,0,0.85), 0 0 0 1px rgba(0,0,0,0.4); }
  .card img { display: block; width: 100%; }
  .desk { left: 780px; top: 70px; width: 940px; border-radius: 18px; }
  .ph1 { left: 710px; top: 290px; width: 250px; border-radius: 26px; }
  .ph2 { left: 1530px; top: 290px; width: 250px; border-radius: 26px; }

  .chips { position: absolute; left: 970px; top: 660px; display: flex; gap: 14px; }
  .chip { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-radius: 12px; background: rgba(28,28,38,0.94); border: 1px solid rgba(255,255,255,0.1); font-size: 20px; font-weight: 650; box-shadow: 0 16px 40px -8px rgba(0,0,0,0.7); }
  .chip i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 14px; color: #0c0c11; background: #f2a65a; }
</style>
<div class="stage">
  <h1>Pick a title.<br><em>Press play.</em></h1>
  <p class="sub">Movies, series and anime for the whole household, on every screen at home. Nothing to set up, nothing to fix.</p>
  <div class="tag"><span>Phone</span><span>Laptop</span><span>TV</span><span>A profile for each person</span></div>

  <div class="card desk"><img src="src/home.jpg" alt=""></div>
  <div class="card ph1"><img src="src/phone-home.jpg" alt=""></div>
  <div class="card ph2"><img src="src/phone-title.jpg" alt=""></div>

  <div class="chips">
    <div class="chip"><i>&#10003;</i>Next episode ready</div>
    <div class="chip"><i>&#10003;</i>Subtitles on</div>
  </div>
</div>
